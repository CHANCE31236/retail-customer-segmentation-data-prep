name: Validate R examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: Install packages
        run: Rscript -e 'install.packages(c("readr", "dplyr", "stringr"), repos="https://cloud.r-project.org")'
      - run: Rscript --vanilla tests/smoke.R
